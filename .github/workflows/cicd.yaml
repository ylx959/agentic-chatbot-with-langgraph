name: Streamlit AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "examples/**"
      - "tests/**"
  pull_request:
    branches:
      - main

  # Allows you to run the workflow manually
  workflow_dispatch:

# Prevent two deployments from running at the same time.
# PRs get their own group (per branch) so they never wait on, or cancel, a deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'agentic-chatbot-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-northeast-1          # change to your region
  ECR_REPOSITORY: agentic-chatbot     # change to your ECR repo name
  CONTAINER_NAME: agentic-chatbot

jobs:
  # ---------- CI: lint + import check (runs on every push / PR) ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen --no-dev

      - name: Lint
        run: uvx ruff check src/

      - name: Import check (builds the graph, no LLM calls)
        env:
          GOOGLE_API_KEY: dummy
          TAVILY_API_KEY: dummy
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'src'); import backend; print(list(backend.chatbot.get_graph().nodes))"

  # ---------- Build the Docker image and push it to Amazon ECR ----------
  build-and-push:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Deploy: SSH into EC2, pull the new image, restart the container ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          REGISTRY: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,REGISTRY,AWS_REGION,CONTAINER_NAME
          script: |
            set -e
            # EC2 pulls from ECR with its IAM instance role (AmazonEC2ContainerRegistryReadOnly)
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "${REGISTRY%%/*}"

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            # ~/app/.env holds the API keys; data/ and faiss_db/ persist across deploys
            mkdir -p ~/app/data ~/app/faiss_db
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 80:8501 \
              --env-file ~/app/.env \
              -v ~/app/data:/app/data \
              -v ~/app/faiss_db:/app/faiss_db \
              "$IMAGE"

            # Health check: fail the deploy if Streamlit doesn't come up within ~60s
            for i in $(seq 1 30); do
              if curl -fs http://localhost/_stcore/health > /dev/null; then
                echo "App is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "App did not become healthy, container logs:"
                docker logs --tail 50 "$CONTAINER_NAME"
                exit 1
              fi
              sleep 2
            done

            docker image prune -af
